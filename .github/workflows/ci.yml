name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      # typecheck only on the newest node — the TypeScript compiler's own
      # engine floor moves faster than our runtime support floor (node ≥ 18).
      - if: matrix.node == 22 && matrix.os == 'ubuntu-latest'
        run: npm run typecheck
      # The published tarball must stay exactly src + fonts + docs — catch a
      # stray directory sneaking into `files` before it ships.
      - name: Check packed file list
        run: |
          npm pack --dry-run --json > pack.json
          node -e '
            const files = require("./pack.json")[0].files.map(f => f.path);
            const bad = files.filter(f => !/^(src\/|assets\/fonts\/|README\.md$|LICENSE$|package\.json$)/.test(f));
            if (bad.length) { console.error("unexpected files in tarball:", bad); process.exit(1); }
            console.log(files.length, "files OK");
          '
